{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Login</h2>
    <p class="muted">Access your account.</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter password">
        <button class="btn full" type="submit">Login</button>
    </form>
    <p class="muted">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    <div class="admin-hint"><strong>Demo Admin</strong><br>admin@gmail.com<br>admin123</div>
</div>
{% endblock %}
